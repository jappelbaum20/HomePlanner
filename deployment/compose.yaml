name: homeplanner
services:
  db:
    image: postgres:17.11-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    restart: unless-stopped
    environment:
      POSTGRES_USER: homeplanner_bootstrap
      POSTGRES_DB: homeplanner
      POSTGRES_PASSWORD_FILE: /run/secrets/db_bootstrap_password
    secrets: [db_bootstrap_password]
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U homeplanner_bootstrap -d homeplanner']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 150
    security_opt: [no-new-privileges:true]
    logging: &logs
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  web:
    image: ${HOMEPLANNER_WEB_IMAGE:-homeplanner-web:local}
    build:
      context: ${HOMEPLANNER_BUILD_CONTEXT:?Set sanitized context path}
      dockerfile: deployment/Dockerfile
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      PORT: '3107'
      HOMEPLANNER_ENABLE_RUNTIME: ${HOMEPLANNER_ENABLE_RUNTIME:-0}
      HOMEPLANNER_ORIGIN: https://home.appelbaums.com
      HOMEPLANNER_PHOTO_VOLUME_ROOT: /var/lib/homeplanner/photos
      HOMEPLANNER_PHOTO_ROOT: /var/lib/homeplanner/photos/data
      HOMEPLANNER_MIN_FREE_BYTES: '21474836480'
      HOMEPLANNER_AUTH_DATABASE_URL_FILE: /run/secrets/auth_database_url
      HOMEPLANNER_APP_DATABASE_URL_FILE: /run/secrets/app_database_url
      HOMEPLANNER_PHOTO_MAINTENANCE_DATABASE_URL_FILE: /run/secrets/photo_maintenance_database_url
      HOMEPLANNER_ACCESS_PUBLIC_DATABASE_URL_FILE: /run/secrets/access_public_database_url
      HOMEPLANNER_MAIL_DATABASE_URL_FILE: /run/secrets/mail_database_url
      HOMEPLANNER_ACCESS_RATE_KEY_FILE: /run/secrets/access_rate_key
      HOMEPLANNER_TRUSTED_PROXY_IP: ${HOMEPLANNER_TRUSTED_PROXY_IP:-}
      # Caddy's network. The app always excludes the gateway, network/broadcast and its own addresses.
      HOMEPLANNER_TRUSTED_PROXY_CIDR: ${HOMEPLANNER_TRUSTED_PROXY_CIDR:-172.20.0.0/16}
      HOMEPLANNER_TRUSTED_PROXY_EXCLUDE: ${HOMEPLANNER_TRUSTED_PROXY_EXCLUDE:-}
      HOMEPLANNER_MAIL_ENABLED: '0'
      HOMEPLANNER_AUTH_SECRET_FILE: /run/secrets/auth_secret
      HOMEPLANNER_CSRF_SECRET_FILE: /run/secrets/csrf_secret
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?Set Google client ID}
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: /run/secrets/google_client_secret
    secrets: [auth_database_url, app_database_url, photo_maintenance_database_url, access_public_database_url, mail_database_url, access_rate_key, auth_secret, csrf_secret, google_client_secret]
    volumes:
      - type: bind
        source: ${HOMEPLANNER_PHOTO_DIR:?Set private photo directory}
        target: /var/lib/homeplanner/photos
        bind: {create_host_path: false}
    ports: ['127.0.0.1:3107:3107']
    networks: [database, outbound]
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3107/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logs
  maintenance:
    image: ${HOMEPLANNER_WEB_IMAGE:-homeplanner-web:local}
    profiles: [operations]
    depends_on:
      db: {condition: service_healthy}
    entrypoint: [/bin/sh, /app/deployment/operations-lock.sh]
    volumes:
      - type: bind
        source: ${HOMEPLANNER_OPERATIONS_LOCK:?Set shared operations lock file}
        target: /run/homeplanner-operations.lock
        read_only: true
        bind: {create_host_path: false}
    environment:
      HOMEPLANNER_MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      HOMEPLANNER_AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
      HOMEPLANNER_APP_DB_PASSWORD_FILE: /run/secrets/app_db_password
      HOMEPLANNER_PHOTO_MAINTENANCE_DB_PASSWORD_FILE: /run/secrets/photo_maintenance_db_password
      HOMEPLANNER_ACCESS_PUBLIC_DB_PASSWORD_FILE: /run/secrets/access_public_db_password
      HOMEPLANNER_MAIL_DB_PASSWORD_FILE: /run/secrets/mail_db_password
    secrets: [migration_database_url, auth_db_password, app_db_password, photo_maintenance_db_password, access_public_db_password, mail_db_password]
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging: *logs
  photo-read:
    image: node:24.22.2-bookworm-slim@sha256:01d566e8d94d8c619591d78652babfccd3c6992a3dffa9ed5ab39e11cf6c70e9
    profiles: [operations]
    user: '1000:1000'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - type: bind
        source: ${HOMEPLANNER_PHOTO_DIR:?Set private photo directory}
        target: /photos
        read_only: true
        bind: {create_host_path: false}
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging: *logs
networks:
  database: {internal: true}
  outbound: {}
volumes:
  db_data: {}
secrets:
  db_bootstrap_password: {file: '${HOMEPLANNER_DB_BOOTSTRAP_PASSWORD_FILE:?Set secret path}'}
  migration_database_url: {file: '${HOMEPLANNER_MIGRATION_DATABASE_URL_FILE:?Set secret path}'}
  auth_db_password: {file: '${HOMEPLANNER_AUTH_DB_PASSWORD_FILE:?Set secret path}'}
  app_db_password: {file: '${HOMEPLANNER_APP_DB_PASSWORD_FILE:?Set secret path}'}
  photo_maintenance_db_password: {file: '${HOMEPLANNER_PHOTO_MAINTENANCE_DB_PASSWORD_FILE:?Set secret path}'}
  access_public_db_password: {file: '${HOMEPLANNER_ACCESS_PUBLIC_DB_PASSWORD_FILE:?Set secret path}'}
  mail_db_password: {file: '${HOMEPLANNER_MAIL_DB_PASSWORD_FILE:?Set secret path}'}
  auth_database_url: {file: '${HOMEPLANNER_AUTH_DATABASE_URL_FILE:?Set secret path}'}
  app_database_url: {file: '${HOMEPLANNER_APP_DATABASE_URL_FILE:?Set secret path}'}
  photo_maintenance_database_url: {file: '${HOMEPLANNER_PHOTO_MAINTENANCE_DATABASE_URL_FILE:?Set secret path}'}
  access_public_database_url: {file: '${HOMEPLANNER_ACCESS_PUBLIC_DATABASE_URL_FILE:?Set secret path}'}
  mail_database_url: {file: '${HOMEPLANNER_MAIL_DATABASE_URL_FILE:?Set secret path}'}
  access_rate_key: {file: '${HOMEPLANNER_ACCESS_RATE_KEY_FILE:?Set persistent secret path}'}
  auth_secret: {file: '${HOMEPLANNER_AUTH_SECRET_FILE:?Set secret path}'}
  csrf_secret: {file: '${HOMEPLANNER_CSRF_SECRET_FILE:?Set secret path}'}
  google_client_secret: {file: '${GOOGLE_OAUTH_CLIENT_SECRET_FILE:?Set secret path}'}
