name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html *.js styles.css _site/ && cp -r photos _site/
          v=${GITHUB_SHA::8}; sed -i -E "s#(src|href)=\"(app|house-data|models3d)\.js\"#\1=\"\2.js?v=$v\"#g; s#href=\"styles\.css\"#href=\"styles.css?v=$v\"#" _site/index.html
          grep -c "?v=$v" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
